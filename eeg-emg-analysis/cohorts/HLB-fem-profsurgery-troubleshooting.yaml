      the 2276 uV bare-wire floor, with near-zero railing and no signal. A
      partially conducting damaged cable, not an open one.

  - animal_id: HLB-D1
    sex: F
    vendor: HLB
    tether_date: 2026-07-30
    placements:
      - {from: 2026-07-30, position: D1, tether_arm: A}
    recordings:
      - {base: allego_1__uid0731-18-06-37, date: 2026-07-31, position: D1}
      - {base: allego_2__uid0802-01-46-57, date: 2026-08-02, position: D1}
      - {base: allego_0__uid0806-12-45-02, date: 2026-08-06, position: D1}
      - {base: allego_1__uid0806-16-57-38, date: 2026-08-06, position: D1}
    notes: >
      Shared-path fault, the clearest one: its own two channels correlate at 0.74
      against 0.07 in working animals, and it rails 100 percent of the time with
      a longest continuous railed run of 130.3 minutes, identical to the position
      that holds no animal.

  - animal_id: HLB-D2
    sex: F
    vendor: HLB
    tether_date: 2026-07-30
    placements:
      - {from: 2026-07-30, position: D2, tether_arm: A}
      # ⚠️ THE TIME MATTERS. The swap happened at 16:27 on 2026-08-06, between
      # the 12:45 afternoon recording (arm A) and the 16:57 overnight recording
      # (arm C). A date-only entry labels both recordings arm C, which would
      # attribute the afternoon's failure to the tether that actually fixed it.
      - from: 2026-08-06 16:27
        position: D2
        tether_arm: C
        tether_notes: long tether, soldered, direct to headstage, no slip ring
        source: vault 2026-08-07-overnight-recording-two-animals-work
    recordings:
      - {base: allego_1__uid0731-18-06-37, date: 2026-07-31, position: D2}
      - {base: allego_2__uid0802-01-46-57, date: 2026-08-02, position: D2}
      - {base: allego_0__uid0806-12-45-02, date: 2026-08-06, position: D2}
      - {base: allego_1__uid0806-16-57-38, date: 2026-08-06, position: D2}
    notes: >
      THE DEMONSTRATION THAT THE TETHER IS THE FIX. Went from 0.0 percent to
      87.9 percent usable EEG after an arm C swap and nothing else: hum 916.9 to
      133.2 uV, spectral slope -0.38 to -2.05, railing 29.7 to 0.0 percent, with
      its implant untouched. Tethered at day 8 after surgery, which is why long
      post-operative recovery is not required for a usable recording.
      ⚠️ A 40-sweep impedance block taken just after the swap said the swap had
      HARMED this animal, p = 8.4e-08. The block spanned 21 minutes and caught
      one long open state. The recording reversed it completely. This is the
      origin of the rule that impedance blocks screen and only a multi-hour
      recording is an outcome.
