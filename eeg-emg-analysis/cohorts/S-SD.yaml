# =============================================================================
# COHORT MANIFEST -- S-SD, SOD1 + CSD, batch 2 of the SOD1 intake series
# =============================================================================
#
# PROVENANCE. Every husbandry value below was read out of the lab's own
# spreadsheet, `~/Downloads/HLB_SOD1_Intake_Monitoring.xlsx`, sheet `Registry`,
# on 2026-08-24. This is the FIRST cohort in this project with real animal ids,
# real surgery dates and real body weights, rather than placeholders.
#
# The `verdict_<date>` notes on each animal are MEASURED, not husbandry: they are
# the rung-2 connection result for that recording, computed against a PER-CHIP
# wire-free floor. They are a CONNECTION measure, not a data-quality score, and
# not a sleep result.
#
# ⚠️ The registry lists `Recording start = 2026-08-25` for every S-SD animal,
#   but the first hour-long recording was actually taken on 2026-08-24 at
#   17:56:51 KST. The sheet is one day behind reality.
#
# 🔴 RETRACTION, 2026-08-26. An earlier version of this file said "B slot 1 has
#   failed across three consecutive cohorts, so a failure at B1 is evidence about
#   the PORT before it is evidence about the mouse." THAT IS WRONG. On 2026-08-26
#   HLBSSD13 was pulled from B1 BECAUSE ITS TETHER WAS CHEWED and the spare
#   HLBSSD17 was put in the same slot: the chip floor went 246 -> 2186 uV, the
#   chip came up grounded, and real EEG and EMG appeared. THE FAULT FOLLOWED THE
#   ANIMAL AND ITS TETHER. B slot 1, its cable, its splitter branch and its XDAQ
#   input are all GOOD.
#   ⭐ What IS true about B1 and C1 is mechanical: they are the two cage positions
#   where animals can reach and chew their tethers. Four such events across two
#   cohorts (W-SD B1 on 08-19, W-SD B1 and C1 on 08-22, S-SD B1 on 08-26, S-SD C1
#   structural failure at the tether centre reported 08-27).
# =============================================================================

cohort_id: S-SD
title: SOD1 + CSD cohort, batch S-SD
project_id: neurosurveillance-eeg
description: >
  Ten male mice, HLBSSD11 to HLBSSD20, surgeries 2026-08-10 to 2026-08-12, all
  tethered 2026-08-18. Eight were on the rig from 2026-08-18; HLBSSD13 came off
  on 2026-08-26 with a chewed tether and HLBSSD17 replaced it in the same slot.
  HLBSSD20 is excluded. This is the batch that followed W-SD.

roles: [eeg, emg]          # /1 EEG, /2 EMG for slot 1; /33, /34 for slot 2
criterion: slope           # EEG only; EMG is broadband, so it is judged on hum

notes: >
  Position labels are RIG POSITIONS, not animals. B1 held HLBSSD13 up to
  2026-08-26 and HLBSSD17 from 2026-08-26 12:50 onwards, so no B1 number crosses
  that boundary.

