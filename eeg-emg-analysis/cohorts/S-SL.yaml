# =============================================================================
# COHORT MANIFEST -- S-SL, the 8 mice recorded ZT0-to-ZT0 on 2026-09-12
# =============================================================================
#
# WHY THIS FILE EXISTS. `cards/ladder.py --cohort` needs to know which rig
# position held which animal, because that is what separates an animal's two
# channels from the wire-free floor sites the criterion is measured against.
# Without it the QC bundle cannot be computed, and without the bundle the
# recording cannot be stripped without permanently destroying that floor.
#
# ⚠️ PROVENANCE. The animal ids and their positions were entered by Andrea in the
# recording console at 09:00 on 2026-09-12 and are carried in the run record
# `be0a4fe112d6` and in that recording's `run.json`. They are NOT yet joined to a
# husbandry sheet.
#
# 🔴 HUSBANDRY IS DELIBERATELY ABSENT. Sex, date of birth, arrival, surgery date,
# surgeon, weights and tether date are NOT recorded here because nobody has read
# them out of the intake spreadsheet for this batch yet. They are left out rather
# than guessed: an invented surgery date is worse than a missing one, and the
# S-SD manifest's own header records that its registry was already one day behind
# reality. Fill them from `HLB_SOD1_Intake_Monitoring.xlsx` (sheet `Registry`,
# header on ROW 5, openpyxl only in ~/eeg-analysis-venv) and add a provenance
# line when you do.
#
# The layout is the standard eight-mouse map: a C3442 splitter puts two RHD2216
# chips on each 64-channel port, so slot 1 is sites /1 (EEG) and /2 (EMG) and
# slot 2 is /33 and /34. Floor sites follow from the role count and are NOT
# listed here -- core/criteria.py derives them, deliberately, because an
# off-by-one in a hand-written floor list silently moves a real animal channel
# into the control group.
# =============================================================================

