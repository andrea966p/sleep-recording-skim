cohort_id: W-SD
title: UV water + chronic sleep deprivation, batch W-SD
project_id: neurosurveillance-eeg
description: >
  Ten male C57BL/6J (B6J-BomTac), HLBWSD01 to HLBWSD10, arrived 2026-07-21,
  surgeries 2026-08-03 to 2026-08-05, all tethered 2026-08-10. Drinking treatment
  is UV-sterilised water, NOT SOD1, so this batch is the water arm: its SOD1
  intake is 0 U by construction. Sleep condition is CHRONIC SLEEP DEPRIVATION,
  CSD start Friday 2026-08-21, sampling Friday 2026-08-28, with each day's
  deprivation bout ending at 13:00. The rebound recording was taken in the
  recovery window after the PENULTIMATE day's bout, 13:00 Thu 08-27 to 09:00
  Fri 08-28. This is the batch that preceded S-SD.

roles: [eeg, emg]          # /1 EEG, /2 EMG for slot 1; /33, /34 for slot 2
criterion: slope           # EEG only; EMG is broadband, so it is judged on hum

notes: >
  Position labels are RIG POSITIONS, not animals. Treatment arm: UV water, target
  dose 0 U. Group mean water intake over the 10 recorded days was 4.04 mL per
  mouse per day (SD of daily means 1.46, SEM 0.46, n=10 days), against a 3 mL
  reference; one-sample t vs 3 mL gives p = 0.051, so intake is not significantly
  different from the reference volume.

