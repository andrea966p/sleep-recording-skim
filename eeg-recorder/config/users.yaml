# Who records, and which channels their rig layout uses.
#
# PRESETS ARE EXPRESSED AS SITE NUMBERS, NEVER AS FILE INDICES.
# A keep list written as indices is not portable between recordings on this rig:
# allego_0__uid0904-08-55-25 has 134 channels with 32-channel ports, so index 160
# does not exist in it and index 128 is an aux channel, not an electrode. The
# service resolves site -> index against each file's own biointerface_map at strip
# time and refuses on any miss. See convert/strip_channels.py.
#
# Site numbering: `D/n` is native index n-1. The second animal on a 64-channel
# splitter port starts at slot 32, so its EEG is /33 and not /29 -- the "+32 trap"
# in 02-procedures/eight-mouse-acquisition-setup.md section 6.
#
# All three presets below were confirmed against real recordings on disk on
# 2026-09-11, not taken from description.

nas:
  share: SKIM_DATA
  root: 03_Data_Mouse          # per-user folders live under this

recording_types: [basal, recovery, sd]

# The three-letter code each recording type contributes to a NAS folder name.
# `20260925_HLBSSL_RSR` = 25 Sep 2026, batch HLBSSL, recovery sleep recording.
# Every type listed above must have a code here or the config is refused: a type
# with no code would silently produce a folder named after nothing.
recording_type_codes:
  basal:    BSR          # basal sleep recording
  recovery: RSR          # recovery sleep recording
  sd:       SDR          # sleep deprivation recording

users:
  andrea:  {default_preset: 8mice_eeg_emg}
  diane:   {default_preset: 8mice_eeg_emg}
  ahyeon:  {default_preset: 8mice_eeg_emg}
  hyunmin: {default_preset: 8mice_eeg_emg}
  staci:   {default_preset: 8mice_eeg_emg}

presets:

  # 16 ch. Seen in allego_1__uid0909-21-17-52 and 14 others.
  # hstg__passthrough_64 / probe__default_8x8, two animals per port.
  8mice_eeg_emg:
    label: "8 mice, EEG + EMG"
    roles: {eeg: 1, emg: 2}                  # site offset within the chip
    slots:                                    # rig position -> base site
      A1: {port: A, base: 0}
      A2: {port: A, base: 32}
      B1: {port: B, base: 0}
      B2: {port: B, base: 32}
      C1: {port: C, base: 0}
      C2: {port: C, base: 32}
      D1: {port: D, base: 0}
      D2: {port: D, base: 32}
    with_gpio: false

  # 24 ch. Seen in allego_0__uid0829-08-34-39 (59.2 h) and allego_5__uid0828-19-10-50.
  8mice_eeg_emg_ecg:
    label: "8 mice, EEG + EMG + ECG"
    roles: {eeg: 1, emg: 2, ecg: 3}
    slots:
      A1: {port: A, base: 0}
      A2: {port: A, base: 32}
      B1: {port: B, base: 0}
      B2: {port: B, base: 32}
      C1: {port: C, base: 0}
      C2: {port: C, base: 32}
      D1: {port: D, base: 0}
      D2: {port: D, base: 32}
    with_gpio: false

  # 24 primary + all 6 GPIO = 30 ch. Seen in allego_0__uid0904-08-55-25 (134 ch, 30 h).
  # hstg__passthrough_32 / probe__default_4x8: FOUR animals, one per port, no splitter.
  # Role names are deliberately UNASSIGNED -- the instruction on 2026-09-11 was
  # "for now just keep 18 19 20 21 22 23". Channels are labelled by site and nothing
  # invents a physiological name for them. When the names are settled they go in
  # `roles:` and nowhere else.
  unipolar_lfp:
    label: "4 mice, unipolar, 6 sites each"
    sites: [18, 19, 20, 21, 22, 23]
    # NO QC CRITERION EXISTS FOR THIS LAYOUT. core/criteria.py judges every
    # channel against wire-free amplifier inputs at base+n../16 on a 64-channel
    # chip. These sites are /18../23 on 32-channel ports, which that model does
    # not describe, so computing a floor for them would measure the animals
    # against the wrong control sites. Declaring it here means the post-stop
    # chain records "no criterion applies" and carries on, instead of demanding
    # that the operator override a guard that can never be satisfied. A guard
    # people are trained to click past is not a guard.
    qc: none
    slots:
      A: {port: A, base: 0}
      B: {port: B, base: 0}
      C: {port: C, base: 0}
      D: {port: D, base: 0}
    with_gpio: true            # this preset selects all six aux/din/dout
