# Who records, and which channels their rig layout uses.
#
# PRESETS ARE EXPRESSED AS SITE NUMBERS, NEVER AS FILE INDICES.
# A keep list written as indices is not portable between recordings on this rig:
# allego_0__uid0904-08-55-25 has 134 channels with 32-channel ports, so index 160
# does not exist in it and index 128 is an aux channel, not an electrode. The
# service resolves site -> index against each file's own biointerface_map at strip
# time and refuses on any miss. See convert/strip_channels.py.
#
# Site numbering: `D/n` is native index n-1. The second animal on a 64-channel
# splitter port starts at slot 32, so its EEG is /33 and not /29 -- the "+32 trap"
# in 20-areas/allego/eight-mouse-acquisition-setup.md section 6.
#
# All three presets below were confirmed against real recordings on disk on
# 2026-09-11, not taken from description.

nas:
  share: SKIM_DATA
  root: 02_Data_Sleep          # <root>/<user>/<batch>/<Baseline|Recovery>/<mouse folder>/

# Rig hardware facts. Andrea 2026-10-09: nothing is wired to the XDAQ GPIO
# header, so a varying din can only be noise on a floating input (run
# ee0263bffeaa went FAILED_STRIP on it). Set to true the day the XDAQ -> Pi
# hardware sync is wired, or the strip's Gate B stops protecting that line.
rig:
  gpio_header_connected: false

recording_types: [basal, recovery]

# The code each recording type contributes to a per-mouse folder name, and the
# condition folder that mouse is filed under.
#   02_Data_Sleep/andrea/HLBSSL/Recovery/20260921_HLBSSL31_R/
# Every type listed above must have both, or the config is refused: a type with
# no code or folder would silently produce a path named after nothing.
# There is no `sd` type: the batch id (HLBWSD, HLBSSD...) already carries it.
recording_type_codes:
  basal:    B            # baseline sleep recording
  recovery: R            # recovery sleep recording

recording_type_folders:
  basal:    Baseline
  recovery: Recovery

users:                        # default_layout names an entry in layout_templates
  andrea:  {default_layout: 8mice_eeg_emg}
  diane:   {default_layout: 8mice_eeg_emg}
  ahyeon:  {default_layout: 4mice_unipolar_lfp}   # unipolar mice, first run 2026-10-15
  hyunmin: {default_layout: 8mice_eeg_emg}
  staci:   {default_layout: 8mice_eeg_emg}

# --------------------------------------------------------------------------- #
# LAYER 1 - CHIP PHYSICS. YAML only, never editable from the web form.
# Changes when hardware changes, which is almost never, and a wrong value here
# silently breaks the enumeration check every other guard leans on.
# --------------------------------------------------------------------------- #
headstages:

  rhd2216_bipolar:
    label: "RHD2216 bipolar"
    slots_per_chip: 32     # native slots consumed in the RHD2000 data stream
    real_channels: 16      # ...of which only the first 16 are real amplifiers
    bipolar_in_hardware: true
    source: "20-areas/allego/CANONICAL-allego-channel-selection.md section 3"

  intan_unipolar_32:
    label: "Intan unipolar (RHD2132)"
    slots_per_chip: 32
    real_channels: 32      # ALL 32 are real. This is why /18../23 carry signal
    bipolar_in_hardware: false
    # A splitter carrying two of these has never been recorded here.
    splitter_verified: false
    source: "10-projects/unipolar-lfp/2026-08-05-unipolar-lfp-mouse-reference.md"

# --------------------------------------------------------------------------- #
# LAYER 2 - WHICH SITE CARRIES WHICH SIGNAL. Addable through a guided form.
#
# 🔑 ONE SETTING PER RUN, SHARED BY EVERY ANIMAL. Mice on this rig always share a
# configuration; what changes between runs is how many are connected and which
# ports carry splitters.
# --------------------------------------------------------------------------- #
recording_settings:

  eeg_emg:
    label: "EEG + EMG"
    headstage: rhd2216_bipolar
    roles: {eeg: 1, emg: 2}
    qc: auto
    seen_in: "allego_1__uid0909-21-17-52 and 14 others"

  eeg_emg_ecg:
    label: "EEG + EMG + ECG"
    headstage: rhd2216_bipolar
    roles: {eeg: 1, emg: 2, ecg: 3}
    qc: auto
    seen_in: "allego_0__uid0829-08-34-39 (59.2 h)"

  eeg_emg_lfp:
    label: "EEG + EMG + LFP (unipolar)"
    headstage: intan_unipolar_32
    # Measured 2026-08-05, port A, all six sites live at once -- the only clean
    # simultaneous EEG, EMG and LFP this project has recorded.
    #
    # These are SINGLE-ENDED sites. The signal is a difference between two of
    # them, and that pairing is deliberately NOT encoded: the strip keeps raw
    # sites and never computes anything.
    #
    # 🔴 ROLES CORRECTED 2026-10-14 (Andrea): the map first written here
    # (emg1 18, lfp_ref 19, lfp_tgt 20, eeg_f 21, eeg_p 22, emg2 23) was a typo.
    # The only correct map is the one below. No stored run used the old one
    # (runs.db checked: 13 eeg_emg, 1 custom), and a run snapshots its roles.
    # Confirmed live the same day: Allego has site_num 18-23 selected on A, B, C.
    roles: {emg_l: 18, lfp_tgt: 19, lfp_ref: 20, emg_r: 21, eeg_p: 22, eeg_f: 23}
    qc: none
    # 🔴 EVIDENCE-ABSENT, NOT SHAPE-MISMATCH. An RHD2132 has 32 REAL inputs, so a
    # floor COULD be derived from the ~26 unused ones. It must not be: the
    # 2026-08-05 page measured them at a median 0.17 MOhm and notes "on this
    # headstage the unused inputs are tied to ground, so a low magnitude proves
    # nothing at all". A floor from ground-tied inputs flatters the control and
    # condemns every real animal. Recorded as absent evidence on purpose -- a
    # shape mismatch invites someone to fix the shape.
    # 2026-10-14: "tied to ground" holds for only 16 of the 26. Empty unipolar
    # headstages (noise-tests uid1001-16-48-09, port C, no animal) read sites
    # 1-8 and 25-32 at amplifier noise (4-5 uV rms) but sites 9-24 as true open
    # inputs (~4 mV, 60 Hz 5-6 mV). A floor from /9-/17 + /24 (10 sites) is
    # PLAUSIBLE but needs the implant's unused pins confirmed unwired and a new
    # validation for single-ended inputs. Until then: none.
    qc_reason: >
      Unipolar RHD2132. Which of its 26 unused real inputs are unwired was never
      recorded; the only instruction on file is "for now just keep 18 19 20 21
      22 23". A floor from them would be a control nobody characterised.
    seen_in: "allego_0__uid0904-08-55-25 (134 ch, 30 h)"

# --------------------------------------------------------------------------- #
# LAYER 3 - ONE-CLICK STARTING POINTS. Freely savable from the UI: a template is
# only a combination of validated layer-1 and layer-2 entries, so it cannot
# invent a site number. These three reproduce the presets they replace.
# --------------------------------------------------------------------------- #
layout_templates:

  8mice_eeg_emg:
    label: "8 mice, EEG + EMG"
    setting: eeg_emg
    splitters: {A: true, B: true, C: true, D: true}

  8mice_eeg_emg_ecg:
    label: "8 mice, EEG + EMG + ECG"
    setting: eeg_emg_ecg
    splitters: {A: true, B: true, C: true, D: true}

  4mice_unipolar_lfp:
    # One RHD2132 per port. A C3442 splitter left in the cable with ONE chip on
    # it still enumerates 32 channels (measured 2026-10-14, A B C = 32 each), so
    # it is declared as no splitter. Untick "In use" on any empty port.
    label: "Up to 4 mice (1 per port), unipolar EEG + EMG + LFP"
    setting: eeg_emg_lfp
    splitters: {A: false, B: false, C: false, D: false}
