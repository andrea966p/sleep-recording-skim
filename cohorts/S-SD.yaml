# =============================================================================
# COHORT MANIFEST -- S-SD, SOD1 + CSD, batch 2 of the SOD1 intake series
# =============================================================================
#
# PROVENANCE. Every husbandry value below was read out of the lab's own
# spreadsheet, `~/Downloads/HLB_SOD1_Intake_Monitoring.xlsx`, sheet `Registry`,
# on 2026-08-24. This is the FIRST cohort in this project with real animal ids,
# real surgery dates and real body weights, rather than placeholders.
#
# The `verdict_2026_08_24` note on each animal is MEASURED, not husbandry: it is
# the rung-2 connection result from allego_0__uid0824-17-56-51, computed against
# a PER-CHIP wire-free floor trimmed of contaminated sites. It is a CONNECTION
# measure, not a data-quality score, and not a sleep result.
#
# ⚠️ The registry lists `Recording start = 2026-08-25` for every S-SD animal,
#   but the first hour-long recording was actually taken on 2026-08-24 at
#   17:56:51 KST. The sheet is one day behind reality.
# =============================================================================

cohort_id: S-SD
title: SOD1 + CSD cohort, batch S-SD
project_id: neurosurveillance-eeg
description: >
  Ten male mice, HLBCSD11 to HLBCSD20, surgeries 2026-08-10 to 2026-08-12, all
  tethered 2026-08-18. Eight are on the rig; HLBCSD17 is operated and tethered
  but has no XDAQ position, and HLBCSD20 is excluded. This is the batch that
  followed W-SD.

roles: [eeg, emg]          # /1 EEG, /2 EMG for slot 1; /33, /34 for slot 2
criterion: slope           # EEG only; EMG is broadband, so it is judged on hum

notes: >
  Position labels are RIG POSITIONS, not animals. B slot 1 has now failed across
  three consecutive cohorts and its wire-free floor 60 Hz is the lowest on the
  rig, so a failure at B1 is evidence about the PORT before it is evidence about
  the mouse. HLBCSD13 sits there and has no adverse surgical note at all.

# -----------------------------------------------------------------------------
recordings:
  - base: allego_0__uid0824-17-56-51
    date: 2026-08-24
    notes: >
      60.04 min, 3.78 GB, rung 0 PASS. First full-hour screen of this cohort.
      4 animals give hour-long usable EEG; only D2 passes the strict
      EEG-and-EMG-in-the-same-epoch gate.

# -----------------------------------------------------------------------------
